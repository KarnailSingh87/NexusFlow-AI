[project]
name = "nexusflow-backend"
version = "0.1.0"
description = "NexusFlow AI — FastAPI control plane for Nebius Token Factory and NVIDIA Nemotron"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The NexusFlow AI Contributors" }]
keywords = ["ai", "llm", "nemotron", "nebius", "fastapi", "agent-orchestration"]

dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.1.2",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10", "mypy==2.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",
    "S",    # bandit — security
    "N",    # pep8-naming
    "D",    # pydocstyle
    "RUF",
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "D105",  # magic methods (__aenter__, __repr__, ...) are self-evident
    "D107",  # __init__ is documented by its class docstring
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D"]
# Pydantic models and SQLAlchemy mappers are self-describing field lists;
# a class-level docstring per schema adds noise, not information.
"app/schemas/**" = ["D101"]
"app/db/models.py" = ["D101", "D105"]
"app/core/config.py" = ["S105"]
"alembic/**" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
