# ===========================================================================
# NexusFlow AI — full local stack
#
#   docker compose up --build
#
# Brings up PostgreSQL, the FastAPI control plane and the Next.js UI.
# Startup order is enforced with healthchecks + `depends_on: condition`, and
# the backend applies Alembic migrations before serving.
# ===========================================================================

name: nexusflow

services:
  # -------------------------------------------------------------------------
  # PostgreSQL — workflows, runs and the token/cost ledger
  # -------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: nexusflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusflow}
      POSTGRES_DB: ${POSTGRES_DB:-nexusflow}
      # Speeds up initdb considerably on Apple Silicon / bind mounts.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for psql / GUI clients. Drop this block to keep Postgres
      # internal to the compose network.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nexusflow} -d ${POSTGRES_DB:-nexusflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [nexusflow]

  # -------------------------------------------------------------------------
  # FastAPI control plane — the only component holding NEBIUS_API_KEY
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-NexusFlow AI API}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # text = human-readable; json = one JSON object per line for aggregators.
      LOG_FORMAT: ${LOG_FORMAT:-text}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}

      # --- secrets -------------------------------------------------------
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — see .env.example}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # --- database ------------------------------------------------------
      # Defaults to the DSN built from the POSTGRES_* block; override
      # DATABASE_URL in .env to point at an external Postgres instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-nexusflow}:${POSTGRES_PASSWORD:-nexusflow}@db:5432/${POSTGRES_DB:-nexusflow}}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_ECHO: ${DB_ECHO:-false}
      # Pool lifecycle: recycle before a proxy drops an idle socket, and ping on
      # checkout so a Postgres restart cannot surface as a failed request.
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      # Start-up warm-up. With DB_FAIL_FAST=false the API still boots and reports
      # itself degraded on /health/ready instead of crash-looping.
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-5}
      DB_CONNECT_BACKOFF_SECONDS: ${DB_CONNECT_BACKOFF_SECONDS:-1.0}
      DB_FAIL_FAST: ${DB_FAIL_FAST:-false}

      # --- Nebius Token Factory -----------------------------------------
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:?NEBIUS_API_KEY is required — get one at https://tokenfactory.nebius.com/project/api-keys}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      NEBIUS_TIMEOUT_SECONDS: ${NEBIUS_TIMEOUT_SECONDS:-120}
      NEBIUS_MAX_RETRIES: ${NEBIUS_MAX_RETRIES:-3}

      # --- NVIDIA Nemotron defaults -------------------------------------
      NEMOTRON_FAST_MODEL: ${NEMOTRON_FAST_MODEL:-nvidia/Nemotron-3_5-Lightning}
      NEMOTRON_BALANCED_MODEL: ${NEMOTRON_BALANCED_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      NEMOTRON_FRONTIER_MODEL: ${NEMOTRON_FRONTIER_MODEL:-nvidia/Nemotron-3-Ultra-550b-a55b}
      NEMOTRON_DEFAULT_MODEL: ${NEMOTRON_DEFAULT_MODEL:-nvidia/Nemotron-3_5-Lightning}
      NEMOTRON_NANO_MODEL: ${NEMOTRON_NANO_MODEL:-nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B}
      NEMOTRON_EMBEDDING_MODEL: ${NEMOTRON_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      MODEL_ALLOWLIST: ${MODEL_ALLOWLIST:-}

      # --- document ingestion -------------------------------------------
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      UPLOAD_STORAGE_DIR: ${UPLOAD_STORAGE_DIR:-/data/uploads}
      UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS:-pdf,docx,txt,csv}
      UPLOAD_REQUIRE_TEXT: ${UPLOAD_REQUIRE_TEXT:-true}
      INGEST_CHUNK_SIZE: ${INGEST_CHUNK_SIZE:-1200}
      INGEST_CHUNK_OVERLAP: ${INGEST_CHUNK_OVERLAP:-200}
      INGEST_MAX_CHUNKS: ${INGEST_MAX_CHUNKS:-2000}
      INGEST_EMBED_CHUNKS: ${INGEST_EMBED_CHUNKS:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}

      # --- access control (development only) -----------------------------
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@nexusflow.local}

      # --- background job queue -----------------------------------------
      # The API process also runs the worker. Scale JOB_WORKER_CONCURRENCY for
      # heavy document workloads, or set JOBS_ENABLED=false on the API and run a
      # dedicated worker process against the same database.
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      JOB_WORKER_CONCURRENCY: ${JOB_WORKER_CONCURRENCY:-2}
      JOB_POLL_INTERVAL: ${JOB_POLL_INTERVAL:-1.0}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_RETRY_BACKOFF_SECONDS: ${JOB_RETRY_BACKOFF_SECONDS:-5.0}
      JOB_STALE_AFTER_SECONDS: ${JOB_STALE_AFTER_SECONDS:-300.0}
      JOB_EXECUTION_TIMEOUT: ${JOB_EXECUTION_TIMEOUT:-900.0}
      JOB_DRAIN_TIMEOUT: ${JOB_DRAIN_TIMEOUT:-30.0}
      JOB_MAX_LOG_ENTRIES: ${JOB_MAX_LOG_ENTRIES:-500}

      # --- generation guard rails ---------------------------------------
      LLM_DEFAULT_TEMPERATURE: ${LLM_DEFAULT_TEMPERATURE:-0.6}
      LLM_DEFAULT_MAX_TOKENS: ${LLM_DEFAULT_MAX_TOKENS:-2048}
      LLM_MAX_MAX_TOKENS: ${LLM_MAX_MAX_TOKENS:-32768}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-100000}

      # --- CORS: the browser hits the API directly, so allow the UI origin.
      # In Docker the browser reaches the API via the published localhost port,
      # hence localhost:3000 rather than the compose service name.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

      # Migrations run via the image ENTRYPOINT (backend/docker-entrypoint.sh),
      # which waits for the DB then applies `alembic upgrade head`.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DB_WAIT_ATTEMPTS: ${DB_WAIT_ATTEMPTS:-30}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Uploaded originals live outside the container filesystem so they
      # survive restarts and redeploys.
      - uploads:/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [nexusflow]

  # -------------------------------------------------------------------------
  # Next.js UI
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined at build time, so changing them
        # requires `docker compose build --no-cache frontend`.
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NexusFlow AI}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_ENABLE_STREAMING: ${NEXT_PUBLIC_ENABLE_STREAMING:-true}
        NEXT_PUBLIC_DEFAULT_MODEL: ${NEXT_PUBLIC_DEFAULT_MODEL:-nvidia/Nemotron-3_5-Lightning}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-120000}
    container_name: nexusflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server-side rendering talks to the backend over the compose network.
      INTERNAL_API_BASE_URL: http://backend:8000
      APP_SECRET: ${APP_SECRET:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [nexusflow]

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local

networks:
  nexusflow:
    driver: bridge
